[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-memory-hermes"
version = "0.3.0"
description = "Hermes Agent memory provider plugin for recall-sqlite (SAG-based, tiered storage)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "recall-sqlite==0.2.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "pyyaml>=6,<7",
    "twine>=5,<7",
]

[project.urls]
homepage = "https://github.com/Jnocode/recall-memory-hermes"
repository = "https://github.com/Jnocode/recall-memory-hermes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib", "--rootdir=tests"]
