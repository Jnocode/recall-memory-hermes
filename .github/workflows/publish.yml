name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and build tooling
        run: python -m pip install -e ".[dev]"
      - name: Verify source, tests, and tag
        run: |
          python scripts/sync_sources.py --check
          python scripts/check_release.py --tag "${GITHUB_REF_NAME}"
          python -m pytest -q
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1