name: recall-memory-hermes
version: "0.3.0"
description: "Local Recall semantic memory provider with curated writes and project isolation"
author: "Jun"
license: Apache-2.0
hermes_version: ">=0.19.0"
kind: exclusive

memory:
  provider: recall-memory-hermes
  provider_name: recall
  entry_point: :register

pip_dependencies:
  - recall-sqlite==0.2.0
  - httpx>=0.27,<1

config:
  db_path:
    type: string
    default: ""
    description: "Recall SQLite DB path; blank uses the active Hermes profile"
  embed_url:
    type: string
    default: "http://127.0.0.1:11434"
    description: "OpenAI-compatible embedding base URL"
  embed_model:
    type: string
    default: "nomic-embed-text"
    description: "Embedding model identifier"
  candidate_multiplier:
    type: integer
    default: 8
    description: "Bounded retrieval candidate multiplier (2-20)"

capabilities:
  - vector_search
  - keyword_search
  - fts5_search
  - tiered_storage
  - session_aware
  - project_namespaces
  - builtin_memory_mirror